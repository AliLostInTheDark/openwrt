# SPDX-License-Identifier: LGPL-2.1-only
#
# udsp - software voice DSP for FXS lines
#
# India. Derived from the India row of ITU Operational Bulletin No. 781
# (1 February 2003), annex to ITU-T E.180, which the tone tables in common
# deployment follow. The bulletin publishes frequencies and cadences but no
# send level, so the levels follow the ITU-T E.180 send reference of -10 dBm0
# and split it across the frequencies of a multi-tone signal.
#
# The dial and ringing tones are 400 Hz amplitude modulated at 25 Hz. The
# grammar has no modulation field, so the carrier and its two side bands
# (375 + 400 + 425 Hz) are played at equal level instead, as AUS.conf does
# for its 425 x 25 Hz tones.

[region]
iso3 = IND
describe = India

[tone dial]
freq = 375 400 425
level = -15 -15 -15
cadence = on
repeat = forever

# The bulletin lists no recall dial tone; the plain dial tone is reused.
[tone short_stutter_dial]
freq = 375 400 425
level = -15 -15 -15
cadence = on
repeat = forever

# Message waiting dial tone: the bulletin lists none, so the dial tone is
# interrupted at the ETSI special dial tone cadence.
[tone stutter]
freq = 375 400 425
level = -15 -15 -15
cadence = 500 50
repeat = forever

[tone second_dial]
freq = 375 400 425
level = -15 -15 -15
cadence = on
repeat = forever

# Ringing tone 400 x 25 Hz, the double ring 400/200/400/2000 ms.
[tone ringback]
freq = 375 400 425
level = -15 -15 -15
cadence = 400 200 400 2000
repeat = forever

# Busy tone 400 Hz at 750/750 ms.
[tone busy]
freq = 400
level = -10
cadence = 750 750
repeat = forever

# Congestion tone 400 Hz at 250/250 ms.
[tone reorder]
freq = 400
level = -10
cadence = 250 250
repeat = forever

# Special information tone, 950/1400/1800 Hz, 330 ms per segment.
[tone sit]
segment = 950 -10 330
segment = 1400 -10 330
segment = 1800 -10 330
silence = 1000
repeat = forever

# The bulletin lists no separate number unobtainable tone; the special
# information tone stands in, as ETS.conf does.
[tone number_unobtainable]
segment = 950 -10 330
segment = 1400 -10 330
segment = 1800 -10 330
silence = 1000
repeat = forever

# Call waiting tone 400 Hz, 200/100/200 ms then 7.5 s of silence, presented
# twice. The engine bounds the tone at (200 + 100 + 200 + 7500) x 2 = 16 s.
[tone call_waiting]
freq = 400
level = -10
cadence = 200 100 200 7500
repeat = 2

# Confirmation: three short 400 Hz bursts, the ETSI shape on the Indian
# frequency.
[tone confirm]
freq = 400
level = -10
cadence = 100 100
repeat = 3

# Receiver off hook: the bulletin publishes none, so the ETSI rising howler is
# played on the Indian frequency.
[tone howler]
segment = 400 -20 3000
segment = 400 -14 3000
segment = 400 -8 3000
segment = 400 -2 3000
silence = 0
repeat = forever

# Power ringing follows the ringing tone: the double ring.
[ring r1]
cadence = 400 200 400 2000

# Distinctive rings: r2 repeats the normal ring, r3 to r5 carry the Bellcore
# dr2 to dr4 shapes, as the other region files do.
[ring r2]
cadence = 400 200 400 2000

[ring r3]
cadence = 800 400 800 4000

[ring r4]
cadence = 400 200 400 200 800 4000

[ring r5]
cadence = 300 200 1000 200 300 4000

[ring r6]
cadence = 400 200 400 2000

[ring r7]
cadence = 400 200 400 2000

[ring r8]
cadence = 400 200 400 2000

# Indian exchanges present the caller as DTMF digits before the first ring
# (EN 300 659-1 annex B, the DTMF variant). The message waiting burst keeps
# the ETSI FSK format, and the timings stay the ETSI fallback of ETS.conf.
[cid]
format = dtmf
mwi_format = etsi-dtas
wait_ms = 100
ack_timeout_ms = 165
seizure_bits = 300
mark_bits = 180

# The flash, release and pulse windows are the ETSI fallback of ETS.conf.
# The break window overlaps the recall window, so the two are mutually
# exclusive per line. pulse_enable off makes recall the live feature.
[hook]
pulse_enable = off
debounce_ms = 10
flash_min_ms = 35
flash_max_ms = 145
release_min_ms = 490
pulse_break_min_ms = 42
pulse_break_max_ms = 94
pulse_make_max_ms = 85
pulse_interdigit_ms = 240
flash_service = drop
