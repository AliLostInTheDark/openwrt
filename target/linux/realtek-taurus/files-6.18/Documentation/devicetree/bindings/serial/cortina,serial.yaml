%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/cortina,serial.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cortina Access UART

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

allOf:
  - $ref: serial.yaml#

properties:
  compatible:
    const: cortina,serial

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-frequency:
    description: UART input clock, used when no clock is given.

required:
  - compatible
  - reg
  - interrupts

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    serial@f43291b0 {
        compatible = "cortina,serial";
        reg = <0xf43291b0 0x30>;
        interrupts = <GIC_SPI 4 IRQ_TYPE_LEVEL_HIGH>;
        clock-frequency = <125000000>;
    };
