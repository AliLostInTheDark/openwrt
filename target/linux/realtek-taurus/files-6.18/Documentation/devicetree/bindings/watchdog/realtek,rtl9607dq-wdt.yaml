%YAML 1.2
---
$id: http://devicetree.org/schemas/watchdog/realtek,rtl9607dq-wdt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL9607DQ watchdog

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description:
  Watchdog timer of the Realtek RTL9607DQ (Cortina Access) SoC. The counter
  runs from the peripheral clock and resets the SoC when it expires.

allOf:
  - $ref: watchdog.yaml#

properties:
  compatible:
    const: realtek,rtl9607dq-wdt

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    watchdog@f432901c {
        compatible = "realtek,rtl9607dq-wdt";
        reg = <0xf432901c 0x30>;
        clocks = <&pclk>;
    };
