%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/realtek,rtl9607dq-ssp.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL9607DQ SSP PCM/TDM controller

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description:
  The voice PCM interface of the RTL9607DQ. It clocks a TDM frame of up to
  32 slots of 8 bits at 8 kHz and moves the valid slots through a DMA queue
  pair of the DMA_SEC block, which it shares with the network engine.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: realtek,rtl9607dq-ssp

  reg:
    items:
      - description: SSP controller
      - description: SSP DMA global control
      - description: SSP DMA queue pair
      - description: SSP DMA interrupt status and enable

  reg-names:
    items:
      - const: ssp
      - const: dma
      - const: queue
      - const: irq

  interrupts:
    items:
      - description: playback DMA
      - description: capture DMA

  interrupt-names:
    items:
      - const: tx
      - const: rx

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - "#sound-dai-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    pcm@f7001b80 {
        compatible = "realtek,rtl9607dq-ssp";
        reg = <0xf7001b80 0x80>, <0xf7001064 0x54>,
              <0xf7001a80 0x80>, <0xf7001e08 0x8>;
        reg-names = "ssp", "dma", "queue", "irq";
        interrupts = <GIC_SPI 17 IRQ_TYPE_LEVEL_HIGH>,
                     <GIC_SPI 18 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "tx", "rx";
        #sound-dai-cells = <0>;
    };
