%YAML 1.2
---
$id: http://devicetree.org/schemas/thermal/realtek,rtl9607dq-thermal.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL9607DQ on-die temperature sensor

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

allOf:
  - $ref: thermal-sensor.yaml#

properties:
  compatible:
    const: realtek,rtl9607dq-thermal

  reg:
    maxItems: 1

  "#thermal-sensor-cells":
    const: 0

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    thermal-sensor@f4320264 {
        compatible = "realtek,rtl9607dq-thermal";
        reg = <0xf4320264 0x10>;
        #thermal-sensor-cells = <0>;
    };
