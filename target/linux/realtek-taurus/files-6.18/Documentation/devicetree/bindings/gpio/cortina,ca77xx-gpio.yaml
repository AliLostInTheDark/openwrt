%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/cortina,ca77xx-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cortina Access CA77xx GPIO controller

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description:
  One GPIO group of the Cortina Access CA77xx / Realtek RTL9607DQ
  peripheral block, with up to 32 pins. An optional second register is
  the pin-mux word of the group, which the driver sets to GPIO for a pin
  when it is requested.

properties:
  compatible:
    const: cortina,ca77xx-gpio

  reg:
    minItems: 1
    items:
      - description: GPIO group registers
      - description: pin-mux word of the group

  gpio-controller: true

  "#gpio-cells":
    const: 2

  ngpios:
    minimum: 1
    maximum: 32

required:
  - compatible
  - reg
  - gpio-controller
  - "#gpio-cells"

additionalProperties: false

examples:
  - |
    bus {
        #address-cells = <2>;
        #size-cells = <2>;

        gpio@4f43292c0 {
            compatible = "cortina,ca77xx-gpio";
            reg = <0x4 0xf43292c0 0x0 0x24>,
                  <0x4 0xf4320100 0x0 0x4>;
            gpio-controller;
            #gpio-cells = <2>;
            ngpios = <16>;
        };
    };
