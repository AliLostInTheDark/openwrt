%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/cortina,ca-qspi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Cortina Access quad SPI flash controller

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description:
  The serial flash controller of Cortina Access CA77xx / Realtek RTL9607DQ
  SoCs, used here with one SPI-NAND chip.

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    const: cortina,ca-qspi

  reg:
    maxItems: 1

  reg-names:
    const: qspi-base

required:
  - compatible
  - reg
  - reg-names

unevaluatedProperties: false

examples:
  - |
    bus {
        #address-cells = <2>;
        #size-cells = <2>;

        spi@4f4324000 {
            compatible = "cortina,ca-qspi";
            reg = <0x4 0xf4324000 0x0 0x50>;
            reg-names = "qspi-base";
            #address-cells = <1>;
            #size-cells = <0>;

            flash@0 {
                compatible = "spi-nand";
                reg = <0>;
            };
        };
    };
