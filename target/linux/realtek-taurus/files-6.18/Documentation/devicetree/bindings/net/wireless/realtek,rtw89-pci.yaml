%YAML 1.2
---
$id: http://devicetree.org/schemas/net/wireless/realtek,rtw89-pci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek rtw89 wireless devices (PCIe)

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description:
  Realtek IEEE 802.11ax PCIe devices handled by the rtw89 driver. The node
  describes a device soldered to the board. On boards that leave the efuse
  of the device blank, the values the efuse would hold are given here.

allOf:
  - $ref: ieee80211.yaml#

properties:
  compatible:
    enum:
      - pci10ec,0192  # RTL8192XB
      - pci10ec,c852  # RTL8852C

  reg:
    maxItems: 1

  nvmem-cells:
    maxItems: 1
    description: Cell holding the MAC address of the device.

  nvmem-cell-names:
    const: mac-address

  realtek,rfe-type:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 254
    description:
      RF front-end type of the board, selecting the BB, RF and TX power
      tables. Types above 50 use an external front-end module.

  realtek,xtal-cap:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 127
    description: Crystal load capacitor trim of the board.

  '#cooling-cells':
    const: 2
    description:
      The device throttles its TX airtime as a thermal cooling device.

  '#thermal-sensor-cells':
    const: 0
    description:
      The device reports its temperature as a thermal sensor.

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    pcie {
        #address-cells = <3>;
        #size-cells = <2>;

        pcie@0,0 {
            reg = <0x0000 0 0 0 0>;
            #address-cells = <3>;
            #size-cells = <2>;
            device_type = "pci";
            ranges;

            wifi@0,0 {
                compatible = "pci10ec,c852";
                reg = <0x0000 0 0 0 0>;
                #cooling-cells = <2>;
                #thermal-sensor-cells = <0>;
                ieee80211-freq-limit = <5170000 5835000>;
                realtek,rfe-type = <54>;
                realtek,xtal-cap = <63>;
            };
        };
    };
