%YAML 1.2
---
$id: http://devicetree.org/schemas/net/realtek,rtl9607dq-pon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL9607DQ PON MAC

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description:
  The GPON/EPON MAC of the RTL9607DQ, driving the board's BOSA optical
  module. Only GPON is supported.

properties:
  compatible:
    const: realtek,rtl9607dq-pon

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  nvmem-cells:
    minItems: 1
    items:
      - description: MAC address of the WAN interface
      - description: BOSA laser driver calibration image

  nvmem-cell-names:
    minItems: 1
    items:
      - const: mac-address
      - const: calibration

  tx-disable-gpios:
    maxItems: 1
    description: Laser transmit disable.

  tx-power-gpios:
    maxItems: 1
    description: Laser driver power enable.

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    pon@f5500000 {
        compatible = "realtek,rtl9607dq-pon";
        reg = <0xf5500000 0xc000>;
        interrupts = <GIC_SPI 1 IRQ_TYPE_LEVEL_HIGH>;
        tx-disable-gpios = <&gpio3 1 GPIO_ACTIVE_HIGH>;
        tx-power-gpios = <&gpio3 0 GPIO_ACTIVE_LOW>;
    };
