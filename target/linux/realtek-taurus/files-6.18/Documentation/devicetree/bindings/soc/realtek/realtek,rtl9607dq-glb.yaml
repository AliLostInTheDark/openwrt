%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/realtek/realtek,rtl9607dq-glb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Realtek RTL9607DQ global configuration registers

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description:
  The GLB block holds the block resets, CPU PLL and divider controls, PHY and
  SerDes selection and status, and other chip-wide configuration shared by the
  CPU clock, PCIe, USB and network drivers.

properties:
  compatible:
    items:
      - const: realtek,rtl9607dq-glb
      - const: syscon

  reg:
    maxItems: 1

  clocks:
    maxItems: 1
    description: 25 MHz crystal reference clock feeding the CPU PLL.

  "#clock-cells":
    const: 0

required:
  - compatible
  - reg
  - clocks
  - "#clock-cells"

additionalProperties: false

examples:
  - |
    syscon@f4320000 {
        compatible = "realtek,rtl9607dq-glb", "syscon";
        reg = <0xf4320000 0x400>;
        clocks = <&refclk>;
        #clock-cells = <0>;
    };
